<title>きょうの よてい（1にちの ながれ）｜むん先生の学習クエスト</title>
<style>
:root{
  --fs:18px;
  --font-goth:"BIZ UDPGothic","BIZ UDPゴシック","Hiragino Maru Gothic ProN","ヒラギノ丸ゴ ProN W4","Hiragino Sans","Meiryo",system-ui,sans-serif;
  --font-kyo:"UD Digi Kyokasho NK-B","UD デジタル 教科書体 NK-B","UD Digi Kyokasho NK-R","UD デジタル 教科書体 NK-R","Hiragino Maru Gothic ProN","Meiryo",system-ui,sans-serif;

body[data-theme="cyber"]{

*{box-sizing:border-box}
html{font-size:var(--fs);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;font-family:var(--font-goth);background:var(--bg);color:var(--text);line-height:1.7;word-break:keep-all;overflow-wrap:anywhere;line-break:strict}
body[data-font="kyo"]{font-family:var(--font-kyo)}
body[data-theme="cyber"]{

    linear-gradient(rgba(63,224,255,.045) 1px,transparent 1px) 0 0/34px 34px,
    linear-gradient(90deg,rgba(63,224,255,.045) 1px,transparent 1px) 0 0/34px 34px,var(--bg);
  background-attachment:fixed;
}
ruby{ruby-position:over}
rt{font-size:.5em;font-weight:500;letter-spacing:0}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}

:focus-visible{outline:3px solid var(--accent2);outline-offset:3px}

.sys{font-family:var(--mono);font-size:.68rem;letter-spacing:.12em;color:var(--accent);opacity:.9}

/* ---------- header */

/* ---------- common */

/* ---------- mode bar */

.nowgrid{display:grid;gap:1rem}

.clockbox{padding:1rem;text-align:center}

.digi{font-size:2.3rem;font-weight:800;line-height:1.2;margin-top:.5rem;font-variant-numeric:tabular-nums}

.kana{font-size:1.35rem;font-weight:800}

.handnote i{display:inline-block;width:1.4rem;height:.45rem;border-radius:9px;vertical-align:middle;margin-right:.2rem}
.card{position:relative;border-radius:24px;border:4px solid var(--c);background:var(--panel);box-shadow:var(--glow)}
.nowcard{padding:1rem 1.1rem 1.1rem;background:var(--panel)}
@supports (background:color-mix(in srgb,red 10%,white)){.nowcard{background:color-mix(in srgb,var(--c) 10%,var(--panel))}}

.nowmain{display:flex;gap:1.1rem;align-items:center;margin-top:.6rem;flex-wrap:wrap}

.tm{font-weight:800;color:var(--muted);font-size:1.05rem;margin:.1rem 0 0}
.remain{margin-top:.9rem}
.bar{height:24px;border-radius:999px;background:var(--panel2);border:2px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);border-radius:999px;transition:width .8s}
.remtxt{font-size:1.45rem;font-weight:800;margin-top:.3rem}
.nowbtns{display:flex;gap:.7rem;flex-wrap:wrap;margin-top:1rem}
.nowbtns .btn{flex:1 1 170px}
.btn.donebtn{background:#17955c;border-color:#17955c;color:#fff;font-size:1.3rem}
.btn.donebtn[aria-pressed="true"]{background:var(--panel);color:#17955c}
.nextcard{display:flex;align-items:center;gap:.9rem;width:100%;margin-top:1rem;padding:.8rem 1rem;text-align:left;border-width:3px}
.nextcard{flex-wrap:wrap}.nextcard .ntxt{flex:1 1 150px;min-width:0}
.nextcard .ill{width:100px;height:100px}
.nm2{font-size:1.45rem;font-weight:800;line-height:1.5;display:block}
.miniclk{flex:0 0 auto;width:78px;height:78px}
.miniclk svg{width:100%;height:100%;display:block}
.when{font-weight:800;font-size:1.05rem;display:block}
.endcard{padding:1.6rem 1.2rem;text-align:center}
.endcard .big{font-size:4rem;line-height:1.2}
.endcard h2{margin:.3rem 0;font-size:1.8rem}
/* flow strip */
.strip{display:flex;align-items:center;gap:.35rem;overflow-x:auto;padding:.8rem .4rem .6rem;margin-top:1rem}
.sitem{--c:#999;position:relative;flex:0 0 auto;width:92px;display:flex;flex-direction:column;align-items:center;gap:.15rem;padding:.35rem .3rem;border-radius:16px;border:2px solid var(--line);background:var(--panel)}
.sitem .ill{width:72px;height:72px;border-radius:14px;border-width:2px}
.sitem .st{font-weight:800;font-size:.85rem;font-variant-numeric:tabular-nums}
.sitem.now{border:4px solid var(--c);transform:scale(1.07);margin:0 .3rem}
.sitem.past{opacity:.4}
.sarrow{color:var(--muted);font-weight:800;font-size:1.1rem}
.chk{position:absolute;top:-8px;right:-8px;width:30px;height:30px;border-radius:50%;background:#17955c;color:#fff;display:grid;place-items:center;font-weight:800;font-size:1rem;border:2px solid #fff;line-height:1}

/* ---------- list view */
.listhead{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin:.2rem 0 .8rem}
.listhead h2{margin:0;font-size:1.5rem;flex:1;min-width:200px}
.daychips{display:flex;gap:.45rem;flex-wrap:wrap}
.daychip{min-width:58px;min-height:50px;border-radius:14px;border:2px solid var(--line);background:var(--panel);font-weight:800;font-size:1.05rem;line-height:1.2;padding:.2rem .6rem}
.daychip small{display:block;font-size:.62rem;color:var(--accent2)}
.daychip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.daychip[aria-pressed="true"] small{color:inherit}
.flow{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.6rem}
.row{--c:#999;position:relative;display:flex;align-items:center;gap:.8rem;width:100%;padding:.55rem .8rem;border-radius:20px;border:3px solid var(--line);background:var(--panel);text-align:left;box-shadow:var(--glow)}
.row::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:7px;border-radius:0 6px 6px 0;background:var(--c)}
.row .tcol{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;width:78px}
.row .tcol .miniclk{width:62px;height:62px}
.row .tcol b{font-size:.95rem;font-variant-numeric:tabular-nums}
.row .ill{width:84px;height:84px}
.row .rtxt{flex:1;min-width:0}
.row .nm{font-size:1.5rem;line-height:1.55}
.row .tmr{display:block;font-size:.9rem;color:var(--muted);font-weight:800}
.row.now{border:5px solid var(--c);background:var(--panel)}
@supports (background:color-mix(in srgb,red 10%,white)){.row.now{background:color-mix(in srgb,var(--c) 13%,var(--panel))}}
.row.past{opacity:.42;filter:grayscale(.6)}
.row .chk{position:static;flex:0 0 auto;width:38px;height:38px;font-size:1.2rem}
.pastchip{flex:0 0 auto;padding:0 .7rem;border-radius:999px;border:2px solid var(--muted);color:var(--muted);font-weight:800;font-size:.9rem}
@media(max-width:560px){.row{gap:.5rem;padding:.45rem .55rem}.row .tcol{width:58px}.row .tcol .miniclk{width:50px;height:50px}.row .ill{width:64px;height:64px}.row .nm{font-size:1.2rem}.badge{font-size:.9rem;padding:.05rem .6rem}.nm{font-size:1.7rem}.nextcard .ill{width:76px;height:76px}.miniclk{width:62px;height:62px}}

/* ---------- overlay / modal */
.overlay{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;background:rgba(2,5,14,.62)}
@media(min-width:720px){.overlay{align-items:center;padding:1rem}}
.sheet,.modal{width:min(720px,100%);max-height:92vh;overflow:auto;background:var(--panel);border-radius:26px 26px 0 0;padding:1.2rem 1.2rem calc(1.2rem + env(safe-area-inset-bottom));border-top:6px solid var(--accent);box-shadow:var(--shadow)}
@media(min-width:720px){.sheet,.modal{border-radius:26px;border:2px solid var(--line);border-top:6px solid var(--accent)}}
@media(prefers-reduced-motion:no-preference){.sheet,.modal{animation:up .25s ease-out}}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.sheet.annc{border-top-color:var(--c);border-top-width:10px}
.fb-title{margin:0;font-size:1.8rem;font-weight:800;line-height:1.4}
.fb-top{display:flex;gap:1rem;align-items:center}
.fb-why{margin:1rem 0 .4rem;font-size:1.25rem;font-weight:800;line-height:2}
.fb-btns{display:flex;gap:.7rem;margin-top:1.1rem;flex-wrap:wrap}
.fb-btns .primary{flex:1}
.annmain{display:flex;gap:1.1rem;align-items:center;margin-top:.8rem;flex-wrap:wrap}
.annmain .ill{width:min(60vw,230px);height:min(60vw,230px);border-width:5px;border-radius:26px}
.stamp{display:inline-grid;place-items:center;width:4.2rem;height:4.2rem;border-radius:50%;background:#fff;border:4px solid #ffd84d;font-size:2.4rem;line-height:1}
@media(prefers-reduced-motion:no-preference){.pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}}
@keyframes pop{from{transform:scale(.2);opacity:0}}
.modal h2{margin:0 0 .6rem;font-size:1.35rem}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:.6rem;flex-wrap:wrap;padding:.6rem 0;border-bottom:1px solid var(--line)}
.setrow .lbl{font-weight:800}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:14px;overflow:hidden;flex-wrap:wrap}
.seg button{min-height:48px;min-width:64px;padding:.2rem .8rem;border:0;background:transparent;font-weight:800;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.guide p,.guide li{line-height:1.85;font-size:.98rem}
.guide h3{margin:1.1rem 0 .3rem;font-size:1.05rem;color:var(--accent)}
.guide ul{padding-left:1.2rem;margin:.3rem 0}
.toast{position:fixed;left:50%;bottom:1.4rem;transform:translateX(-50%);z-index:90;max-width:90vw;padding:.7rem 1.2rem;border-radius:16px;background:var(--text);color:var(--bg);font-weight:800;box-shadow:var(--shadow);text-align:center}

/* ---------- edit */
.erow{--c:#999;display:flex;align-items:center;gap:.6rem;padding:.4rem .6rem;border-radius:16px;border:2px solid var(--line);border-left:8px solid var(--c);background:var(--panel)}
.erow .ill{width:56px;height:56px;border-radius:12px;border-width:2px}
.erow .et{font-weight:800;min-width:7.2em;font-size:.95rem;font-variant-numeric:tabular-nums}
.erow .en{flex:1;font-weight:800;min-width:0;line-height:1.6}
.erow.warn{border-color:#e06c6c}
.ibtn{flex:0 0 auto;min-width:52px;min-height:48px;border-radius:12px;border:2px solid var(--line);background:var(--panel);font-weight:800}
.tools{display:grid;gap:.8rem}
@media(min-width:760px){.tools{grid-template-columns:repeat(2,1fr)}}

.tools h3{margin:0 0 .3rem;font-size:1.05rem}

<body data-theme="soft" data-font="goth">
<header class="top">
  <div class="brand">
    <div class="sys">MUN-QUEST // DAY FLOW</div>
    <h1>きょうの よてい</h1>
  </div>
  <button class="tbtn" id="btnEdit" aria-label="よていを つくる（おとな用・ながおし）">✏️<small>へんしゅう</small><span class="fill" aria-hidden="true"></span></button>
  <button class="tbtn" id="btnGuide" aria-label="先生・おうちの方へ">👪<small>おとなの方へ</small></button>
  <button class="tbtn" id="btnSet" aria-label="せってい">⚙️<small>せってい</small></button>
</header>
<main id="screen" tabindex="-1"></main>
<div id="layer"></div>
<div class="sr" id="live" aria-live="polite"></div>

<script>
(function(){
'use strict';
/* ====== サイト設定（必要なら変更してください） ====== */
const STORE_KEY='munq_life11_dayflow_v1';   // この端末の中だけに保存（ほかのアプリのデータには触れません）
const PORTAL_URL='/';                        // 「サイトへもどる」のリンク先

/* ====== 便利関数 ====== */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ruby=s=>esc(s).replace(/\{([^|{}]+)\|([^{}]+)\}/g,'<ruby>$1<rt>$2</rt></ruby>');
const plain=s=>String(s).replace(/\{([^|{}]+)\|([^{}]+)\}/g,'$2');
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const WD=['にち','げつ','か','すい','もく','きん','ど'];

/* ====== 時刻 ====== */
const toMin=t=>{const p=String(t||'').split(':');return (+p[0]||0)*60+(+p[1]||0);};
const toHM=n=>{n=Math.max(0,Math.min(1439,Math.round(n)));return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');};
const h12=h=>h%12||12;
const digi=n=>{n=Math.floor(n);return h12(Math.floor(n/60)%24)+':'+String(n%60).padStart(2,'0');};
const FUN=['ぷん','ぷん','ふん','ぷん','ぷん','ふん','ぷん','ふん','ぷん','ふん'];
const kanaT=n=>{n=Math.floor(n);const h=Math.floor(n/60)%24,m=n%60;return h12(h)+'じ'+(m?m+FUN[m%10]:'');};
const speakT=n=>{n=Math.floor(n);const h=Math.floor(n/60)%24,m=n%60;return h12(h)+'時'+(m?m+'分':'');};
const durKana=n=>{n=Math.max(1,Math.ceil(n));if(n<60)return n+FUN[n%10];const h=Math.floor(n/60),m=n%60;return h+'じかん'+(m?m+FUN[m%10]:'');};
const durSay=n=>{n=Math.max(1,Math.ceil(n));if(n<60)return n+'分';const h=Math.floor(n/60),m=n%60;return h+'時間'+(m?m+'分':'');};
const ampm=n=>Math.floor(n/60)%24<12?'ごぜん':'ごご';

/* ====== 読み上げ ====== */
const TTS={
  ok:('speechSynthesis' in window)&&('SpeechSynthesisUtterance' in window),
  voice:null,
  pickVoice(){
    if(!this.ok)return;
    const vs=speechSynthesis.getVoices().filter(v=>/^ja/i.test(v.lang));
    this.voice=vs.find(v=>v.localService&&/Nanami|Kyoko|O-ren|Haruka|Ayumi|Sayaka/i.test(v.name))||vs.find(v=>v.localService)||vs[0]||null;
  },
  speak(text,btn){
    if(!this.ok||!text)return;
    this.stop();
    const u=new SpeechSynthesisUtterance(text);
    u.lang='ja-JP';if(this.voice)u.voice=this.voice;
    u.rate=S.slow?0.82:1.0;u.pitch=1.05;
    if(btn)btn.classList.add('speaking');
    const done=()=>{if(btn)btn.classList.remove('speaking');};
    u.onend=done;u.onerror=done;
    setTimeout(()=>{try{speechSynthesis.speak(u);}catch(e){done();}},60);
  },
  stop(){
    if(!this.ok)return;
    try{speechSynthesis.cancel();}catch(e){}
    document.querySelectorAll('.speaking').forEach(b=>b.classList.remove('speaking'));
  }
};
if(TTS.ok){TTS.pickVoice();try{speechSynthesis.addEventListener('voiceschanged',()=>TTS.pickVoice());}catch(e){}}
else document.body.classList.add('notts');

/* ====== 音（やさしい チャイム・効果音） ====== */
let actx=null,unlocked=false;
function audio(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();}catch(e){}return actx;}
function sfx(type){
  if(type==='chime'||type==='pre'){if(!S.chime)return;}else if(!S.sound)return;
  const a=audio();if(!a)return;
  try{
    const t0=a.currentTime+0.03;
    const seq={
      chime:[[659,0,1],[523,.5,1],[587,1,1],[392,1.5,1.6]],
      pre:[[880,0,.7],[740,.35,.9]],
      ok:[[784,0,.4],[988,.12,.4],[1175,.24,.6]],
      tap:[[880,0,.3]]
    }[type]||[[660,0,.4]];
    const vol=type==='chime'?0.2:type==='tap'?0.07:0.15;
    seq.forEach(([f,t,len])=>{
      const o=a.createOscillator(),g=a.createGain();
      o.type='sine';o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t0+t);
      g.gain.exponentialRampToValueAtTime(vol,t0+t+0.03);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+t+len);
      o.connect(g);g.connect(a.destination);o.start(t0+t);o.stop(t0+t+len+0.05);
    });
  }catch(e){}
}
function unlock(){
  if(unlocked)return;unlocked=true;
  audio();
  if(TTS.ok){try{const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u);}catch(e){}}
  document.querySelectorAll('.tapbar').forEach(x=>x.remove());
  applyWake();
}
document.addEventListener('pointerdown',unlock);
document.addEventListener('keydown',unlock);

/* ====== 時計（SVG） ====== */
function clockSVG(T,o){
  o=o||{};const big=!!o.big;
  const mm=T%60,h=Math.floor(T/60)%24,sec=(mm-Math.floor(mm))*60;
  const pt=(deg,r)=>{const a=deg*Math.PI/180;return [(r*Math.sin(a)).toFixed(2),(-r*Math.cos(a)).toFixed(2)];};
  let s=`<svg viewBox="-110 -110 220 220" role="img" aria-label="${esc(o.label||('とけい '+kanaT(T)))}">`;
  s+=`<circle r="105" fill="#fff" stroke="${o.ring||K}" stroke-width="${big?7:10}"/>`;
  if(o.remain>0){
    const a0=mm*6,sw=Math.min(o.remain,60)*6;
    if(sw>=359.5)s+=`<circle r="97" fill="#ff6b6b" opacity=".4"/>`;
    else{const [x0,y0]=pt(a0,97),[x1,y1]=pt(a0+sw,97);s+=`<path d="M0 0L${x0} ${y0}A97 97 0 ${sw>180?1:0} 1 ${x1} ${y1}Z" fill="#ff6b6b" opacity=".4"/>`;}
  }
  for(let i=0;i<60;i++){
    const five=i%5===0;if(!big&&!five)continue;
    const [x1,y1]=pt(i*6,five?86:92),[x2,y2]=pt(i*6,99);
    s+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${K}" stroke-width="${five?(big?4:7):1.6}" stroke-linecap="round"/>`;
  }
  for(let n=1;n<=12;n++){
    if(!big&&n%3)continue;
    const [x,y]=pt(n*30,big?70:60);
    s+=`<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central" font-size="${big?24:38}" font-weight="800" fill="${K}">${n}</text>`;
  }
  const ha=((h%12)+mm/60)*30,ma=mm*6;
  s+=`<line x1="0" y1="10" x2="0" y2="-52" stroke="#e53935" stroke-width="${big?10:14}" stroke-linecap="round" transform="rotate(${ha.toFixed(2)})"/>`;
  s+=`<line x1="0" y1="14" x2="0" y2="-84" stroke="#2f6fd6" stroke-width="${big?6:9}" stroke-linecap="round" transform="rotate(${ma.toFixed(2)})"/>`;
  if(big&&S.sec)s+=`<line x1="0" y1="18" x2="0" y2="-90" stroke="#f0a000" stroke-width="2.5" stroke-linecap="round" transform="rotate(${(sec*6).toFixed(1)})"/>`;
  s+=`<circle r="${big?8:12}" fill="${K}"/></svg>`;
  return s;
}
const miniClock=n=>`<span class="miniclk">${clockSVG(n,{label:kanaT(n)})}</span>`;

/* ====== いまの じょうたい ====== */
let simOffset=0;
const nowD=()=>new Date(Date.now()+simOffset);
const dkey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
function stateOf(items,T){
  let cur=null,next=null;
  for(const it of items){const s=toMin(it.s),e=toMin(it.e);if(!cur&&s<=T&&T<e)cur=it;if(!next&&s>T)next=it;}
  return {cur,next};
}
function ctx(){
  const d=nowD(),wd=d.getDay();
  const T=d.getHours()*60+d.getMinutes()+d.getSeconds()/60;
  const items=(wd>=1&&wd<=5)?store.week[wd]:[];
  return {d,wd,T,items,key:dkey(d),st:stateOf(items,T)};
}
function doneIds(){const k=dkey(nowD());if(store.done.date!==k){store.done={date:k,ids:[]};}return store.done.ids;}
function statusOf(it,c){if(c.st.cur===it)return 'now';if(toMin(it.e)<=c.T)return 'past';if(c.st.next===it)return 'next';return 'later';}

function liveUpdate(c){

/* ---- 1びょう ごとの チェック */
function tick(){
  const c=ctx();
  if(view!=='edit'){
    const sig=sigOf(c);
    if(sig!==lastSig){
      const curChanged=lastSig.split('|')[2]!==(c.st.cur?c.st.cur.id:'');
      const sc=window.scrollY;R[view]();lastSig=sigOf(c);window.scrollTo(0,sc);
      if(view==='list'&&curChanged)scrollToNow();
    }else liveUpdate(c);
  }
  const cid=c.st.cur?c.st.cur.id:'';
  if(prevCur!==undefined&&cid!==prevCur&&c.st.cur&&view!=='edit')announce(c.st.cur);
  if(cid!==prevCur&&preFor&&preFor!==cid){preFor='';}
  prevCur=cid;
  if(view!=='edit'&&c.st.cur&&S.pre>0){
    const it=c.st.cur,s=toMin(it.s),e=toMin(it.e),rem=e-c.T,k=c.key+it.id;
    if(e-s>=15&&rem<=S.pre&&rem>S.pre-1&&!notified.has(k)){notified.add(k);preNotice(it,c.st.next);}
  }
}

function resizeImg(file,max){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>{const img=new Image();img.onload=()=>{
      const k=Math.min(1,max/Math.max(img.width,img.height));const cv=document.createElement('canvas');
      cv.width=Math.max(1,Math.round(img.width*k));cv.height=Math.max(1,Math.round(img.height*k));
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);res(cv.toDataURL('image/jpeg',0.8));
    };img.onerror=rej;img.src=fr.result;};
    fr.onerror=rej;fr.readAsDataURL(file);
  });
}

/* ---- よみこみ（ファイルの中身を たしかめる） */
function cleanImport(o){
  if(!o||typeof o!=='object'||!o.week)throw new Error('bad');
  const photos={};
  if(o.photos&&typeof o.photos==='object')Object.keys(o.photos).forEach(k=>{const v=o.photos[k];if(typeof v==='string'&&/^data:image\/(png|jpe?g|gif|webp);base64,[A-Za-z0-9+/=]+$/.test(v)&&/^[\w-]{1,40}$/.test(k))photos[k]=v;});
  const week={};
  DAYS.forEach(w=>{
    const arr=Array.isArray(o.week[w])?o.week[w]:[];
    week[w]=arr.filter(x=>x&&ACT[x.type]&&/^\d\d:\d\d$/.test(x.s)&&/^\d\d:\d\d$/.test(x.e)).slice(0,60).map(x=>({
      id:uid(),type:x.type,s:x.s,e:x.e,
      label:typeof x.label==='string'?x.label.slice(0,40):'',
      to:DEST[x.to]?x.to:'',
      msg:typeof x.msg==='string'?x.msg.slice(0,80):'',
      photo:typeof x.photo==='string'&&photos[x.photo]?x.photo:''
    }));
  });
  return {week,photos};
}

  if(d.delid!==undefined){const it=findItem(d.delid);if(!it)return;delTarget=it.id;
    openModal(`<h2>🗑 けしますか？</h2><p style="font-weight:800">${digi(toMin(it.s))}〜${digi(toMin(it.e))}　${lblHTML(it)}</p><div class="btnrow"><button class="btn big" data-act="close">やめる</button><button class="btn big danger" data-act="delok">けす</button></div>`);return;}
  if(d.pick!==undefined&&draft){draft.type=d.pick;if(d.pick==='idou'&&!draft.to)draft.to='kyoshitsu';refreshDraftUI();sfx('tap');return;}
  if(d.dest!==undefined&&draft){draft.to=d.dest;refreshDraftUI();sfx('tap');return;}
  if(d.dur!==undefined&&draft){draft.e=toHM(toMin(draft.s)+(+d.dur));const ie=layer.querySelector('[data-f="e"]');if(ie)ie.value=draft.e;checkTimes();return;}
  if(d.cday!==undefined){t.setAttribute('aria-pressed',String(t.getAttribute('aria-pressed')!=='true'));return;}
  const a=d.act;
  if(a==='bg'){if(e.target===t){TTS.stop();closeLayer();}return;}
  switch(a){
    case 'toNow':listDay=null;go('now');break;
    case 'toList':listDay=null;go('list');break;
    case 'close':TTS.stop();closeLayer();if(draft){draft=null;gcPhotos();save();}break;
    case 'sayh':TTS.speak(sayText,t);break;
    case 'done':{
      const ids=doneIds();if(!ids.includes(d.id)){ids.push(d.id);save();}
      sfx('ok');const c=ctx();const nx=c.st.next;
      layer.innerHTML=`<div class="overlay" data-act="bg"><div class="sheet" role="dialog" aria-modal="true" style="border-top-color:#17955c"><div class="fb-top"><span class="stamp pop">⭐</span><p class="fb-title" style="color:#17955c">できたね！</p></div>${nx?`<p class="fb-why">つぎは ${lblHTML(nx)}。<br>${kanaT(toMin(nx.s))}に なったら はじまるよ。</p>`:'<p class="fb-why">よく がんばったね。</p>'}<div class="fb-btns"><button class="btn primary big" data-act="close">OK</button></div></div></div>`;
      layer.querySelector('.btn.primary').focus({preventScroll:true});
      if(S.voice)TTS.speak('できたね！'+(nx?` つぎは、${lblSay(nx)}。 ${speakT(toMin(nx.s))}に なったら はじまるよ。`:''));
      lastSig='';break;}
    case 'add':openItem(null);break;
    case 'trysay':if(draft)TTS.speak(`${speakT(toMin(draft.s))}に なりました。 ${sayMsg(draft)}`,t);break;
    case 'phdel':if(draft){draft.photo='';refreshDraftUI();}break;
    case 'saveitem':{
      if(!draft||!checkTimes())return;
      const w=editDay,arr=store.week[w];
      draft.label=(draft.label||'').trim();draft.msg=(draft.msg||'').trim();
      if(draft.type!=='idou')draft.to='';
      if(draft.id){const i=arr.findIndex(x=>x.id===draft.id);if(i>=0)arr[i]=Object.assign({},draft);}
      else arr.push(Object.assign({},draft,{id:uid()}));
      draft=null;sortDay(w);gcPhotos();save();closeLayer();prevCur=undefined;R.edit();toast('ほぞん しました');break;}
    case 'delok':{const w=editDay;store.week[w]=store.week[w].filter(x=>x.id!==delTarget);delTarget=null;gcPhotos();save();closeLayer();prevCur=undefined;R.edit();toast('けしました');break;}
    case 'copyday':
      openModal(`<h2>📋 ${WDF(editDay)}の よていを コピー</h2><p>コピーさきの ようびを えらんで ください（いまの よていは おきかわります）。</p><div class="daychips">${DAYS.filter(x=>x!==editDay).map(x=>`<button class="daychip" data-cday="${x}" aria-pressed="false">${WD[x]}</button>`).join('')}</div><div class="btnrow"><button class="btn big" data-act="close">やめる</button><button class="btn primary big" data-act="copyok">コピーする</button></div>`);break;
    case 'copyok':{
      const to=[...layer.querySelectorAll('[data-cday][aria-pressed="true"]')].map(b=>+b.dataset.cday);
      if(!to.length){toast('ようびを えらんで ください');break;}
      to.forEach(w=>{store.week[w]=store.week[editDay].map(x=>Object.assign({},x,{id:uid()}));});
      save();closeLayer();prevCur=undefined;toast(to.map(w=>WD[w]).join('・')+'に コピー しました');break;}
    case 'simgo':{
      const v=($('#simT')||{}).value;if(!/^\d\d:\d\d$/.test(v||''))break;
      const now=new Date();const tgt=new Date(now);tgt.setDate(now.getDate()+(editDay-now.getDay()));
      tgt.setHours(+v.slice(0,2),+v.slice(3,5),0,0);simOffset=tgt-now;prevCur=undefined;preFor='';notified.clear();go('now');break;}
    case 'simoff':simOffset=0;prevCur=undefined;preFor='';notified.clear();if(view==='edit')R.edit();else{lastSig='';tick();}break;
    case 'testann':{const c=ctx();const it=c.st.cur||c.st.next||c.items[0]||store.week[editDay][0];if(it){closeLayer();announce(it);}else toast('よていが ありません');break;}
    case 'export':{
      try{
        const data=JSON.stringify({app:'munq-dayflow',v:1,week:store.week,photos:store.photos});
        const url=URL.createObjectURL(new Blob([data],{type:'application/json'}));
        const el=document.createElement('a');el.href=url;el.download=`kyou-no-yotei-${dkey(new Date())}.json`;document.body.appendChild(el);el.click();
        setTimeout(()=>{URL.revokeObjectURL(url);el.remove();},800);
      }catch(err){toast('かきだせませんでした');}break;}
    case 'impok':if(pendingImport){store.week=pendingImport.week;store.photos=pendingImport.photos;pendingImport=null;save();closeLayer();prevCur=undefined;R.edit();toast('よみこみました');}break;
    case 'resetweek':
      openModal(`<h2>↩️ みほんに もどしますか？</h2><p>げつ〜きんの よていと しゃしんが みほんに もどります。 もとには もどせません。</p><div class="btnrow"><button class="btn big" data-act="close">やめる</button><button class="btn big danger" data-act="resetok">もどす</button></div>`);break;
    case 'resetok':store.week=sampleWeek();store.photos={};save();closeLayer();prevCur=undefined;R.edit();toast('みほんに もどしました');break;
  }
});
document.addEventListener('input',e=>{
  const f=e.target.dataset&&e.target.dataset.f;if(!f||!draft)return;
  draft[f]=e.target.value;
  if(f==='s'||f==='e')checkTimes();
  if(f==='label'){const fm=$('#fm',layer);if(fm)fm.placeholder=defSay(draft);}
});
document.addEventListener('change',e=>{
  if(e.target.id==='phf'&&draft){
    const file=e.target.files&&e.target.files[0];if(!file)return;
    resizeImg(file,360).then(url=>{
      const pid='p'+uid();store.photos[pid]=url;
      if(!save()){delete store.photos[pid];return;}
      draft.photo=pid;refreshDraftUI();
    }).catch(()=>toast('しゃしんを よみこめませんでした'));
    e.target.value='';
  }
  if(e.target.id==='impf'){
    const file=e.target.files&&e.target.files[0];if(!file)return;
    const fr=new FileReader();
    fr.onload=()=>{
      try{
        pendingImport=cleanImport(JSON.parse(fr.result));
        const n=DAYS.reduce((a,w)=>a+pendingImport.week[w].length,0);
        openModal(`<h2>📂 よみこみますか？</h2><p>よてい ${n}こ を よみこみます。 いまの よていは おきかわります。</p><div class="btnrow"><button class="btn big" data-act="close">やめる</button><button class="btn primary big" data-act="impok">よみこむ</button></div>`);
      }catch(err){toast('この ファイルは よみこめません');}
    };
    fr.readAsText(file);e.target.value='';
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&layer.firstChild){TTS.stop();closeLayer();if(draft){draft=null;gcPhotos();save();}}});
$('#btnSet').addEventListener('click',openSettings);
$('#btnGuide').addEventListener('click',openGuide);

/* へんしゅうボタン：こどもが まちがえて おさないよう 1びょう ながおし */
(function(){
  const b=$('#btnEdit');let timer=null,held=false;
  const cancel=()=>{clearTimeout(timer);timer=null;b.classList.remove('holding');};
  b.addEventListener('pointerdown',()=>{if(!S.lock)return;held=false;b.classList.add('holding');timer=setTimeout(()=>{held=true;cancel();go('edit');},1000);});
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,cancel));
  b.addEventListener('contextmenu',e=>e.preventDefault());
  b.addEventListener('click',e=>{
    if(!S.lock){go('edit');return;}
    if(held){held=false;return;}
    if(e.detail===0){openModal(`<h2>✏️ へんしゅう（おとな用）</h2><p>よていを へんしゅう しますか？</p><div class="btnrow"><button class="btn big" data-act="close">やめる</button><button class="btn primary big" id="goEdit">へんしゅう する</button></div>`);$('#goEdit').addEventListener('click',()=>go('edit'));return;}
    toast('おとなの ひとは 1びょう ながおし してね');
  });
})();

applySettings();
go('now',{nofocus:true});
setInterval(tick,1000);
if(location.hash==='#selftest')window.__D={store,S,ctx,go,tick,setSim:(w,hm)=>{const now=new Date();const t=new Date(now);t.setDate(now.getDate()+(w-now.getDay()));t.setHours(+hm.slice(0,2),+hm.slice(3,5),0,0);simOffset=t-now;},st:()=>({view,prevCur,preFor,lastSig})};
})();
</script>
</body>
